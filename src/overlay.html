<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #overlay {
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <script>
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.core;
    const overlay = document.getElementById("overlay");

    function applyColor({ r, g, b, a }) {
      overlay.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${a / 255})`;
    }

    listen("set-overlay-color", (event) => applyColor(event.payload));

    // Pull initial color in case we missed the startup emit before listener was ready
    invoke("get_overlay_color").then(applyColor).catch(() => {});
  </script>
</body>
</html>
